# Builds the Jekyll site and publishes it directly to GitHub Pages (no gh-pages branch).
# One-time setting: Settings -> Pages -> Build and deployment -> Source: GitHub Actions.
name: Deploy site

on:
  push:
    branches:
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
  pull_request: # build only, to catch errors before merging
    branches:
      - main
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency: # one deployment at a time; a newer push waits rather than cancelling a deploy in progress
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # pinned: ubuntu-latest (26.04) only ships the newest Ruby patch releases and ImageMagick 7,
    # while al-folio's image pipeline expects ImageMagick 6's `convert`
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v7

      - name: Setup Ruby 💎
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3" # latest 3.3.x available on the runner
          bundler-cache: true

      - name: Setup Node 🧰 # JS runtime for jekyll-terser and purgecss
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Build 🔧
        run: |
          sudo apt-get update && sudo apt-get install -y imagemagick
          export JEKYLL_ENV=production
          bundle exec jekyll build

      - name: Purge unused CSS 🧹
        run: |
          npm install -g purgecss
          purgecss -c purgecss.config.js

      - name: Upload site 📦
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy 🚀
        id: deployment
        uses: actions/deploy-pages@v5
